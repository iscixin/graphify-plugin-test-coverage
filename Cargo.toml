[package]
name = "graphify-plugin-test-coverage"
version = "0.1.0"
edition = "2021"
description = "Graphify plugin: coverage symbol bridge over LCOV/JSON data"

[lib]
name = "graphify_plugin_test_coverage"
path = "src/lib.rs"

[dependencies]
graphify-core = { path = "../../GraphifyRust/graphify-core" }
graphify-registry = { path = "../../GraphifyRust/graphify-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"